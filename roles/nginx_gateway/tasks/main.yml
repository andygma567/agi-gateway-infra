---
- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Reload nginx

- name: Install the gateway routing config
  ansible.builtin.copy:
    src: gateway.conf
    dest: /etc/nginx/conf.d/gateway.conf
    mode: "0644"
  notify: Reload nginx
