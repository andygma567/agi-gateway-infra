# Routes by hostname. litellm.test points at this VM in /etc/hosts;
# nginx decides where each request goes by reading its Host header.

server {
    listen 80;
    server_name litellm.test;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;      # let LLM tokens stream through as they arrive
    }
}
