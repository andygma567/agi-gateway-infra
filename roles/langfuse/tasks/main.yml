---
- name: Create the Langfuse directory
  ansible.builtin.file:
    path: /opt/langfuse
    state: directory
    mode: "0755"

- name: Download the Langfuse compose file
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/langfuse/langfuse/main/docker-compose.yml
    dest: /opt/langfuse/docker-compose.yml
    mode: "0644"
    force: true
    backup: true

- name: Install the Langfuse environment file
  ansible.builtin.copy:
    src: langfuse.env
    dest: /opt/langfuse/.env
    mode: "0600"

- name: Start the Langfuse stack
  community.docker.docker_compose_v2:
    project_src: /opt/langfuse
    state: present
